name: Release TestFlight build
# Anyone with write access (Jerry, Tom) can run this from the Actions tab.
# Needs three repository secrets from an App Store Connect Team API key:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the full text of AuthKey_<id>.p8)
on:
  workflow_dispatch:
  # TestFlight builds expire after 90 days: ship a fresh one on the 1st of every month.
  schedule:
    - cron: '0 17 1 * *'

permissions:
  contents: write

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            if [ "${{ github.event_name }}" = schedule ]; then echo "::notice::No App Store Connect key yet; Jerry's Mac does the monthly build."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
            echo "::error::Add the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets first (see README, 'Ship app code changes')."; exit 1
          fi
      - name: Write API key
        if: env.SKIP != '1'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Build and upload
        if: env.SKIP != '1'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          if [ "${{ github.event_name }}" = schedule ]; then ios/release-testflight.sh --if-stale; else ios/release-testflight.sh; fi
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
