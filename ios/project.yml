name: Trip
options:
  bundleIdPrefix: com.shishi88.trip
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
targets:
  Trip:
    type: application
    platform: iOS
    sources:
      - path: Trip
    info:
      path: Trip/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shishi88.trip
        PRODUCT_NAME: Trip
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '14'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_CFBundleDisplayName: Trip
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationQueriesSchemes: "comgooglemaps whatsapp instagram fb"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TripUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TripUITests
    dependencies:
      - target: Trip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shishi88.trip.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Trip:
    build:
      targets:
        Trip: all
    test:
      targets:
        - TripUITests
