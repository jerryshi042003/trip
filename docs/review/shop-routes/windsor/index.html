<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip | Windsor Shinjuku</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #171719;
      background: #fff;
    }
    * { box-sizing: border-box }
    body { margin: 0 }
    main { max-width: 36rem; margin: auto; padding: clamp(1.5rem, 7vw, 4rem) 1.25rem 2rem }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.04; letter-spacing: -.045em }
    h1 span { display: block }
    address { margin-top: .85rem; font-size: 1rem; font-style: normal; line-height: 1.5 }
    section { border-block: 1px solid #d5d5d8; margin-top: 1.75rem; padding-block: 1.25rem }
    h2 { margin: 0; font-size: 1rem; line-height: 1.45; font-weight: 650 }
    .exit { margin: .15rem 0; font-size: 2.65rem; font-weight: 720; letter-spacing: -.045em; line-height: 1.15 }
    .landmark { margin: .45rem 0 0; font-size: 1rem; line-height: 1.5 }
    a {
      display: grid;
      place-items: center;
      min-height: 52px;
      margin-top: 1.25rem;
      padding: .65rem 1rem;
      border-radius: .6rem;
      background: #151719;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 650;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #18588c; outline-offset: 4px }
    a:active { background: #3c424a }
  </style>
</head>
<body>
  <main>
    <h1>Windsor Racket Shop<span>Shinjuku</span></h1>
    <address>Tochigi Building · B1, 1F and 2F<br>1-3-15 Nishishinjuku, Tokyo</address>
    <section aria-labelledby="arrival">
      <h2 id="arrival">If you arrive on the Oedo Line</h2>
      <p class="exit">Exit D4</p>
      <p class="landmark">Shinjuku-nishiguchi Station. The shop is beside the exit.</p>
    </section>
    <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Windsor%20Racket%20Shop%20Shinjuku%2C%201-3-15%20Nishishinjuku%2C%20Tokyo">Get directions</a>
  </main>
</body>
</html>
