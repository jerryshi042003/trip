<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#141419;--sec:#626269;--sep:rgba(60,60,67,.18);--tint:#005fbd;--fill:rgba(118,118,128,.12);--seg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sec:#a9a9b0;--sep:rgba(84,84,88,.65);--tint:#70b8ff;--fill:rgba(118,118,128,.24);--seg:#37373b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 40px)}
h1{display:flex;align-items:center;gap:9px;font:700 34px/1.15 -apple-system,"SF Pro Display",sans-serif;letter-spacing:.01em;margin:14px 4px 12px}
.trip-mark{display:block;border-radius:8px;border:1px solid var(--sep)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px;position:sticky;top:env(safe-area-inset-top);z-index:2;background:var(--bg);border-bottom:1px solid var(--sep)}
.seg button,.who button{appearance:none;border:0;min-height:44px;background:transparent;color:var(--sec);font:500 15px/1.25 -apple-system,sans-serif;padding:6px;cursor:pointer}
.seg button[aria-pressed=true]{color:var(--text);box-shadow:inset 0 -2px var(--tint);font-weight:650}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--fill);border-radius:10px;padding:3px}
.who button{border-radius:7px}
.who button[aria-pressed=true]{background:var(--seg);color:var(--text);font-weight:650}
:where(button,a[href],summary):focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
.dot{width:8px;height:8px;border-radius:50%;background:#34c759;flex-shrink:0}
.dot.off{background:var(--sep)}
.hdr{font-size:15px;font-weight:650;color:var(--sec);margin:20px 16px 8px}
.group{background:var(--card);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;text-decoration:none;color:inherit}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.main{flex:1;min-width:0;overflow-wrap:anywhere}
.t{font-size:17px}
.s{font-size:15px;color:var(--sec);margin-top:2px}
.ja{font-size:15px;margin-top:3px}
.date{font-size:15px;color:var(--sec);flex:0 0 clamp(74px,24vw,104px);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:4px;flex-shrink:0}
.acts:empty{display:none}
.task{align-items:flex-start}
.task details{margin-top:8px}
.task summary{cursor:pointer;color:var(--tint);padding:8px 0}
.task p{margin:8px 0;white-space:pre-wrap}
.a{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--tint);text-decoration:none;border:0;cursor:pointer;font:600 12px -apple-system,sans-serif}
.a svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chev{color:var(--sec);opacity:.6;font-size:20px}
.lock{color:var(--tint);font-size:17px;border:0;background:none;min-height:44px;padding:6px 4px;cursor:pointer}
.state{margin:20px 16px;color:var(--sec)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;font-size:15px;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:360px){.person{flex-wrap:wrap;gap:8px}.person .main{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1><img class="trip-mark" src="icon-180.png?v=2" width="32" height="32" alt="">Trip</h1>
  <nav class="seg" aria-label="Trip sections">
    <button data-v="plan" aria-pressed="true">Plan</button>
    <button data-v="places" aria-pressed="false">Places</button>
    <button data-v="people" aria-pressed="false">People</button>
    <button data-v="where" aria-pressed="false">Where</button>
  </nav>
  <div class="who" role="group" aria-label="Traveler">
    <button data-who="jerry" aria-pressed="true">Jerry</button>
    <button data-who="tom" aria-pressed="false">Tom</button>
  </div>
  <main id="out"><p class="state" role="status">Loading trip…</p></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const I = {
    map:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    call:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
    mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    msg:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
    web:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'
  };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} } };
  const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1300); };
  const gmap = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  const travelerKeys = ['jerry', 'tom'];
  const viewKeys = ['plan', 'places', 'people', 'where'];
  const requestedTraveler = new URLSearchParams(location.search).get('who');
  const linkedTraveler = travelerKeys.includes(requestedTraveler);
  const savedView = store.get('view');
  const savedTraveler = store.get('who');
  let D = null;
  let view = !linkedTraveler && viewKeys.includes(savedView) ? savedView : 'plan';
  let who = linkedTraveler ? requestedTraveler : travelerKeys.includes(savedTraveler) ? savedTraveler : 'jerry';
  if (linkedTraveler) store.set('who', who);

  const placeRow = p => `<div class="row"><div class="main"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.addr)}</div>${p.ja ? `<div class="ja">${esc(p.ja)}</div>` : ''}</div><div class="acts">${p.ja ? `<button class="a" data-copy="${esc(p.ja)}" aria-label="Copy">${I.copy}</button>` : ''}<a class="a" href="${gmap(p.ja || p.addr)}" aria-label="Map">${I.map}</a></div></div>`;
  const personRow = p => {
    const a = [];
    if (p.phone) a.push(`<a class="a" href="tel:${esc(p.phone)}" aria-label="Call">${I.call}</a>`);
    if (p.whatsapp) a.push(`<a class="a" href="https://wa.me/${esc(p.whatsapp)}" aria-label="WhatsApp">${I.msg}</a>`);
    else if (p.phone && p.phone.length > 6) a.push(`<a class="a" href="sms:${esc(p.phone)}" aria-label="Message">${I.msg}</a>`);
    if (p.email) a.push(`<a class="a" href="mailto:${esc(p.email)}" aria-label="Email">${I.mail}</a>`);
    if (p.ig) a.push(`<a class="a" href="https://ig.me/m/${esc(p.ig)}" aria-label="Instagram">IG</a>`);
    if (p.fb) a.push(`<a class="a" href="${esc(p.fb)}" aria-label="Facebook">FB</a>`);
    if (p.web) a.push(`<a class="a" href="${esc(p.web)}" aria-label="Website">${I.web}</a>`);
    const sub = [p.role, p.phoneLabel || p.phone, p.email].filter(Boolean).join(' · ');
    return `<div class="row person"><div class="main"><div class="t">${esc(p.name)}</div><div class="s">${esc(sub)}</div></div><div class="acts">${a.join('')}</div></div>`;
  };
  const taskRow = task => `<div class="row task"><div class="main"><div class="t">${esc(task.title)}</div><div class="s">${esc(task.detail)}</div>${task.draft ? `<details><summary>Draft message</summary><p>${esc(task.draft)}</p><button class="lock" data-copy="${esc(task.draft)}">Copy draft</button></details>` : ''}</div>${task.link ? `<a class="a" href="${esc(task.link)}" aria-label="Open link for ${esc(task.title)}">${I.web}</a>` : ''}</div>`;

  function render() {
    document.querySelector('.who').hidden = view !== 'plan';
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === view)));
    document.querySelectorAll('.who button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.who === who)));
    if (!D) return;
    const byId = Object.fromEntries(D.places.map(p => [p.id, p]));
    let h = '';
    const T = D.travelers[who];
    if (view === 'plan') {
      for (const section of T.todos ?? []) {
        h += `<h2 class="hdr">${esc(section.title)}</h2><div class="group">${section.items.map(taskRow).join('')}</div>`;
      }
      if (T.todos?.length) h += '<h2 class="hdr">Itinerary</h2>';
      h += `<div class="group">${T.plan.map(x => { const p = byId[x.place]; return `<a class="row" ${p ? `href="${gmap(p.ja || p.addr)}"` : ''}><div class="date">${esc(x.date)}</div><div class="main"><div class="t">${esc(x.title)}</div>${x.sub ? `<div class="s">${esc(x.sub)}</div>` : ''}</div>${p ? '<span class="chev">›</span>' : ''}</a>`; }).join('')}</div>`;
      if (T.bucket && T.bucket.length) h += `<h2 class="hdr">Bucket list</h2><div class="group">${T.bucket.map(b => `<div class="row"><div class="main"><div class="t">${esc(b)}</div></div></div>`).join('')}</div>`;
    } else if (view === 'places') {
      for (const city of [...new Set(D.places.map(p => p.city))]) h += `<h2 class="hdr">${esc(city)}</h2><div class="group">${D.places.filter(p => p.city === city).map(placeRow).join('')}</div>`;
    } else if (view === 'where') {
      h = `<div class="group">${Object.values(D.travelers).map(x => `<a class="row" ${x.where ? `href="${esc(x.where)}"` : ''}><span class="dot${x.where ? '' : ' off'}"></span><div class="main"><div class="t">${esc(x.name)}</div><div class="s">${x.where ? 'Live location' : 'Not shared'}</div></div>${x.where ? '<span class="chev">›</span>' : ''}</a>`).join('')}</div>`;
    } else {
      const groups = new Map();
      for (const person of D.people) {
        const title = person.group || 'Contacts';
        if (!groups.has(title)) groups.set(title, []);
        groups.get(title).push(person);
      }
      for (const [title, contacts] of groups) {
        h += `<h2 class="hdr">${esc(title)}</h2><div class="group">${contacts.map(personRow).join('')}</div>`;
      }
      h += `<h2 class="hdr">Emergency</h2><div class="group">${D.emergency.map(personRow).join('')}</div>`;
    }
    document.getElementById('out').innerHTML = h;
  }


  document.addEventListener('click', e => {
    const w = e.target.closest('.who button');
    if (w) {
      who = w.dataset.who;
      store.set('who', who);
      if (linkedTraveler) {
        const url = new URL(location.href);
        url.searchParams.set('who', who);
        history.replaceState(null, '', url);
      }
      render();
      return;
    }
    const s = e.target.closest('.seg button'); if (s) { view = s.dataset.v; store.set('view', view); render(); window.scrollTo(0, 0); return; }
    const c = e.target.closest('[data-copy]');
    if (c) {
      const copy = navigator.clipboard?.writeText(c.dataset.copy);
      if (copy) copy.then(() => toast('Copied'), () => toast('Could not copy. Select the text to copy it.'));
      else toast('Could not copy. Select the text to copy it.');
    }
  });

  render();
  fetch('trip.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('Trip data unavailable'); return r.json(); })
    .then(d => { D = d; render(); })
    .catch(() => {
      document.getElementById('out').innerHTML = '<p class="state" role="status">Trip could not load.</p><button class="lock" id="retry">Try again</button>';
      document.getElementById('retry').addEventListener('click', () => location.reload());
    });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
